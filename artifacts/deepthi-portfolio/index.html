<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deepthi Ramesh — Data analyst, pipelines and applied AI</title>
    <meta name="description" content="Deepthi Ramesh is a data analyst who follows a business question through messy data, reliable pipelines and useful AI tools. Case studies, research and contact." />
    <meta name="author" content="Deepthi Ramesh" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#F5EFC6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#231815" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Deepthi Ramesh — I turn messy data into tools teams can use" />
    <meta property="og:description" content="Data analysis, reliable pipelines and applied-AI projects, built around a clear business question." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%img/deepthi.jpg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Deepthi Ramesh — Data analyst, pipelines and applied AI" />
    <meta name="twitter:description" content="Data analysis, reliable pipelines and applied-AI projects, built around a clear business question." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      (function () {
        var d = document.documentElement, t = null, m = null;
        try { t = localStorage.getItem('dr-theme'); m = localStorage.getItem('dr-motion'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (m !== 'on' && m !== 'off') m = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'on';
        if (t === 'dark') d.classList.add('dark');
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.setAttribute('content', t === 'dark' ? '#231815' : '#F5EFC6');
        });
        d.setAttribute('data-motion', m);
      })();
    </script>
    <!-- build:structured-data -->
  </head>

    <noscript><style>.no-js-only{display:block!important}.needs-js{display:none!important}.reveal{opacity:1!important;transform:none!important}</style></noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
