kind = "web"
previewPath = "/"
title = "Deepthi Ramesh — Data & AI"
description = "A personal, story-led portfolio showing Deepthi Ramesh’s data analysis, engineering, research and applied AI projects, with thoughtful lightweight interactions and accessible light and dark themes."
version = "1.0.0"
id = "artifacts/deepthi-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18595

[services.development]
run = "pnpm --filter @workspace/deepthi-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/deepthi-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/deepthi-portfolio/dist/public"

[[services.production.rewrites]]
from = "/work/food-inspections"
to = "/work/food-inspections/index.html"

[[services.production.rewrites]]
from = "/work/food-inspections/"
to = "/work/food-inspections/index.html"

